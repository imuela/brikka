spring:
  application:
    name: brika-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:brika}
    username: ${DB_USER:brika}
    password: ${DB_PASSWORD:brika_dev_password}
    hikari:
      pool-name: brika-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Sprint 22 cierre, punto 5: SMTP config for SmtpEmailSender — only used when
  # brika.notifications.email-transport=smtp. Defaults match Mailpit's local SMTP port (1025),
  # no auth/TLS required. NoOpEmailSender (the default everywhere) never touches this block.
  mail:
    host: ${MAILPIT_SMTP_HOST:localhost}
    # 11025, not Mailpit's internal 1025 — the backend runs outside docker-compose
    # (mvn spring-boot:run) and reaches Mailpit through the host-mapped port (docker-compose.yml
    # "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"), same non-standard-port pattern already used
    # for every other local service in this stack.
    port: ${MAILPIT_SMTP_PORT:11025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

brika:
  # Sprint 22 cierre, punto 5: base URL the backend uses to build password-reset links it emails
  # out — never used to decide trust/CORS (that stays brika.security.cors-allowed-origins).
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

  notifications:
    # D8-2/ADR-NOTIF-001: "noop" (no EMAIL provider approved) stays the default in every
    # environment. Sprint 22 cierre §5 authorizes "smtp" as a LOCAL-only opt-in against Mailpit —
    # never a production provider decision.
    email-transport: ${EMAIL_TRANSPORT:noop}
    email-from: ${EMAIL_FROM:no-reply@brika.local}

  security:
    # Sprint 13 D1 (06_SECURITY_SPECIFICATION.md §9, "CORS controlado"): comma-separated list
    # of allowed browser origins, never a wildcard. Defaults to the local Angular dev server.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

    # Sprint 22 cierre (ADR-AUTH-001): Brika's own auth is now the only issuer in every
    # environment — Keycloak has been retired (27_KEYCLOAK_REMOVAL_ANALYSIS.md). SecurityConfig
    # no longer has a toggle between issuers; these values feed the credentials/token
    # infrastructure directly.
    self-auth:
      access-token-ttl-seconds: ${SELF_AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${SELF_AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
      password-reset-ttl-seconds: ${SELF_AUTH_PASSWORD_RESET_TTL_SECONDS:3600}
      portal-refresh-token-ttl-seconds: ${SELF_AUTH_PORTAL_REFRESH_TOKEN_TTL_SECONDS:2592000}
      login-attempt-window-seconds: ${SELF_AUTH_LOGIN_ATTEMPT_WINDOW_SECONDS:900}
      login-attempt-max-failures: ${SELF_AUTH_LOGIN_ATTEMPT_MAX_FAILURES:5}
      # Sprint 22 cierre, punto 4: shared secret for InternalCredentialBootstrapController
      # (/internal/auth/**), same pattern as brika.ai.worker-callback-secret (ADR-AI-001) — empty
      # by default so the endpoint rejects everything (fail closed) until a real dev secret is
      # set locally. Never a product/admin feature; only for local credential bootstrap/migration.
      internal-bootstrap-secret: ${INTERNAL_AUTH_BOOTSTRAP_SECRET:}

  ai:
    # D10-5: local/testable transport is the default so `mvn verify` never depends on a
    # running Python process (LocalAiTaskDispatcher). Set to "http" only once a real
    # ai-worker/ process is deployed and reachable (HttpAiTaskDispatcher).
    worker-transport: ${AI_WORKER_TRANSPORT:local}
    worker-url: ${AI_WORKER_URL:http://localhost:8100}
    # Base URL the Worker uses to reach this Spring Boot instance's internal callback
    # endpoint (ADR-AI-001) — only meaningful when worker-transport=http.
    callback-base-url: ${AI_CALLBACK_BASE_URL:http://localhost:8080}
    # Shared secret checked manually by AiExtractionCallbackController (not part of the
    # JWT-based SecurityConfig chains). Empty by default: an unset secret makes the
    # callback endpoint reject every request rather than silently accepting an
    # unauthenticated one.
    worker-callback-secret: ${AI_WORKER_CALLBACK_SECRET:}

  storage:
    # MinIO (Sprint 0 infra), S3-compatible (18_STORAGE_SPECIFICATION.md §2). The
    # bucket itself is created by the storage-init one-shot service, not here.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:19000}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${MINIO_ROOT_USER:brika}
    secret-key: ${MINIO_ROOT_PASSWORD:brika_dev_password}
    bucket: ${MINIO_BUCKET:brika-documents}
    presigned-url-ttl-seconds: ${STORAGE_PRESIGNED_TTL_SECONDS:300}
    # Provisional technical defaults (Sprint 4 pre-flight decision), not a
    # documented business catalog — see Sprint 4 gate review.
    max-file-size-bytes: 20971520

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{requestId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# DB_* defaults match the Sprint 0 docker-compose Postgres service
# (127.0.0.1:15432/brika) so `./mvnw spring-boot:run` works against it
# out of the box. See 25_CLAUDE_CODE_EXECUTION_GUIDE.md.
