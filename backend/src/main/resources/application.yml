spring:
  application:
    name: brika-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:brika}
    username: ${DB_USER:brika}
    password: ${DB_PASSWORD:brika_dev_password}
    hikari:
      pool-name: brika-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:18081/realms/brika}

brika:
  security:
    # Not validated when unset (empty string): no Keycloak realm/client is
    # provisioned yet (Sprint 0 only started bare Keycloak, no "brika" realm
    # — see 19_IDENTITY_OAUTH_SPECIFICATION.md, no documented client id/aud).
    # Set once the realm exists, so audience validation (§4) is enforced.
    expected-audience: ${OIDC_EXPECTED_AUDIENCE:}

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{requestId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Sprint 1: persistence + Flyway only. No JPA entities, no RBAC, no business
# logic. DB_* defaults match the Sprint 0 docker-compose Postgres service
# (127.0.0.1:15432/brika) so `./mvnw spring-boot:run` works against it
# out of the box. See 25_CLAUDE_CODE_EXECUTION_GUIDE.md.
