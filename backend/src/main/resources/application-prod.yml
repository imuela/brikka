# BRIKA — perfil PROD (Sprint 24, "environments").
# Activo vía SPRING_PROFILES_ACTIVE=prod en el despliegue real. Este perfil es ESTRICTO:
# ProdEnvironmentValidator (EnvironmentPostProcessor) aborta el arranque si faltan
# secretos (claves JWT), si el email no es SMTP, si el seed queda habilitado o si CORS
# permite localhost/comodines. Nada aquí se compromete al repositorio como valor real:
# cada secreto llega por variable de entorno del orquestador.
spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_TLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

brika:
  frontend-base-url: ${FRONTEND_BASE_URL:}

  notifications:
    # En PROD el transporte es SIEMPRE smtp — nunca "noop" (ADR-NOTIF-001 D8-2).
    email-transport: smtp
    email-from: ${SMTP_FROM:${EMAIL_FROM:no-reply@brika.local}}

  security:
    # Origen del frontend real; vacío por defecto y exigido por ProdEnvironmentValidator.
    # Jamás un comodín y jamás localhost en producción.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  # El seed reproducible (empresa, usuarios de demo, bancos) está terminantemente
  # prohibido en producción. Validado además por ProdEnvironmentValidator.
  seed:
    enabled: false