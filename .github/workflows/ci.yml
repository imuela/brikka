name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build, format check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Sprint 26: NotificationAsyncIntegrationIT connects to a real RabbitMQ broker rather than a
    # Testcontainers one (see the test's own javadoc — Testcontainers RabbitMQ needs more RAM than
    # the local dev host has). Locally that broker is the docs/docker-compose.yml "rabbitmq"
    # service, already running; GitHub Actions has no such standing service, so it's declared here
    # instead, matching that service's image/credentials/port exactly (host port 25672, same as
    # application.yml's spring.rabbitmq.port default) so no other configuration has to change.
    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: brika
          RABBITMQ_DEFAULT_PASS: brika_dev_password
        ports:
          - 25672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, unit tests, Flyway integration tests (Testcontainers), format check
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --watch=false

  # Sprint 12 D12-3: build the backend image, boot it against a real Postgres, verify
  # /actuator/health, then scan for known-vulnerable dependencies/base-image CVEs. Build only —
  # no push to a registry, no deployment (out of Sprint 12 scope).
  backend-docker:
    name: Backend Docker (build, healthcheck, security scan)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brika
          POSTGRES_USER: brika
          POSTGRES_PASSWORD: brika
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brika"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t brika-backend:ci backend
      - name: Run container
        run: |
          docker run -d --name brika-backend-ci \
            --network host \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_NAME=brika \
            -e DB_USER=brika \
            -e DB_PASSWORD=brika \
            brika-backend:ci
      - name: Wait for /actuator/health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time."
          docker logs brika-backend-ci
          exit 1
      - name: Container logs (always, for diagnostics)
        if: always()
        run: docker logs brika-backend-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f brika-backend-ci || true
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: brika-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
