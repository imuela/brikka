<h2 mat-dialog-title>{{ isEditMode ? 'Editar inmueble' : 'Registrar inmueble' }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="field-row">
    <mat-form-field>
      <mat-label>Tipo de inmueble</mat-label>
      <input matInput formControlName="propertyType" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Calle</mat-label>
      <input matInput formControlName="street" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Ciudad</mat-label>
      <input matInput formControlName="city" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Código postal</mat-label>
      <input matInput formControlName="postalCode" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Provincia</mat-label>
      <input matInput formControlName="province" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Valoración (€)</mat-label>
      <input matInput type="number" formControlName="valuation" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Precio de compra (€)</mat-label>
      <input matInput type="number" formControlName="purchasePrice" />
    </mat-form-field>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="20" />
      } @else {
        Guardar
      }
    </button>
  </mat-dialog-actions>
</form>
