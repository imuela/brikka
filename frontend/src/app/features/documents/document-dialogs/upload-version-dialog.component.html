<h2 mat-dialog-title>Subir nueva versión</h2>
<mat-dialog-content class="field-row">
  <input type="file" (change)="onFileSelected($event)" />
  @if (file()) {
    <p>{{ file()!.name }}</p>
  }
  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="loading() || !file()"
    (click)="submit()">
    @if (loading()) {
      <mat-spinner diameter="20" />
    } @else {
      Subir
    }
  </button>
</mat-dialog-actions>
