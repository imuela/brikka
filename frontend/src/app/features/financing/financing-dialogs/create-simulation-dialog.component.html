<h2 mat-dialog-title>Nueva simulación</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="field-row">
    <mat-form-field>
      <mat-label>Importe (€)</mat-label>
      <input matInput type="number" formControlName="principal" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Tipo de interés (%)</mat-label>
      <input matInput type="number" formControlName="interestRate" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Plazo (meses)</mat-label>
      <input matInput type="number" formControlName="termMonths" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Cuota estimada (€)</mat-label>
      <input matInput type="number" formControlName="estimatedPayment" required />
    </mat-form-field>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="20" />
      } @else {
        Crear simulación
      }
    </button>
  </mat-dialog-actions>
</form>
