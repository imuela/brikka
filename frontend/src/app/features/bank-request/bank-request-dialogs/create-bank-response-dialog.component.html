<h2 mat-dialog-title>Registrar respuesta del banco</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="field-row">
    <mat-form-field>
      <mat-label>Resumen</mat-label>
      <textarea matInput formControlName="summary" required></textarea>
      @if (form.controls.summary.hasError('required')) {
        <mat-error>El resumen es obligatorio.</mat-error>
      }
    </mat-form-field>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="20" />
      } @else {
        Registrar respuesta
      }
    </button>
  </mat-dialog-actions>
</form>
