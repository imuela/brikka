<div class="page-header">
  <h1>Empresas</h1>
  <a
    *appHasPermission="'COMPANY_CREATE'"
    mat-flat-button
    color="primary"
    routerLink="/app/companies/new">
    <mat-icon>add</mat-icon>
    Nueva empresa
  </a>
</div>

@if (error()) {
  <p class="error-text">{{ error() }}</p>
} @else if (companies() === null) {
  <mat-spinner diameter="32" />
} @else if (companies()!.length === 0) {
  <p>No hay empresas todavía.</p>
} @else {
  <div class="table-scroll">
  <table mat-table [dataSource]="companies()!">
    <ng-container matColumnDef="legalName">
      <th mat-header-cell *matHeaderCellDef>Razón social</th>
      <td mat-cell *matCellDef="let company">
        <a [routerLink]="['/app/companies', company.id]">{{ company.legalName }}</a>
      </td>
    </ng-container>
    <ng-container matColumnDef="tradeName">
      <th mat-header-cell *matHeaderCellDef>Nombre comercial</th>
      <td mat-cell *matCellDef="let company">{{ company.tradeName }}</td>
    </ng-container>
    <ng-container matColumnDef="taxId">
      <th mat-header-cell *matHeaderCellDef>NIF/CIF</th>
      <td mat-cell *matCellDef="let company">{{ company.taxId }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let company">
        <app-status-badge [value]="company.status" [labels]="companyStatusLabels" />
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  </div>
}
