<h2 mat-dialog-title>Nueva versión de criterios</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="field-row">
    <mat-form-field>
      <mat-label>Versión</mat-label>
      <input matInput formControlName="version" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Vigente desde</mat-label>
      <input matInput type="date" formControlName="effectiveFrom" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Reglas (JSON)</mat-label>
      <textarea matInput rows="10" formControlName="rules" required></textarea>
    </mat-form-field>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="20" />
      } @else {
        Crear versión
      }
    </button>
  </mat-dialog-actions>
</form>
