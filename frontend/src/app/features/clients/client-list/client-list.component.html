<div class="page-header">
  <h1>Clientes</h1>
  <ng-container *appHasPermission="'CLIENT_CREATE'">
    <a
      *appHideForRole="'SUPERADMIN'"
      mat-flat-button
      color="primary"
      routerLink="/app/clients/new">
      <mat-icon>add</mat-icon>
      Nuevo cliente
    </a>
  </ng-container>
</div>

@if (error()) {
  <p class="error-text">{{ error() }}</p>
} @else if (clients() === null) {
  <mat-spinner diameter="32" />
} @else if (clients()!.length === 0) {
  <p>No hay clientes todavía.</p>
} @else {
  <div class="table-scroll">
  <table mat-table [dataSource]="clients()!" class="clients-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let client">
        <a [routerLink]="['/app/clients', client.id]">{{ client.firstName }} {{ client.lastName }}</a>
      </td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let client">{{ client.email }}</td>
    </ng-container>
    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Teléfono</th>
      <td mat-cell *matCellDef="let client">{{ client.phone }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let client">
        <app-status-badge [value]="client.status" [labels]="clientStatusLabels" />
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  </div>
}
