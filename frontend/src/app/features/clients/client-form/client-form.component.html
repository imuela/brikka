<h1>{{ isEditMode ? 'Editar cliente' : 'Nuevo cliente' }}</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="field-row">
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="firstName" required />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Apellidos</mat-label>
    <input matInput formControlName="lastName" required />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" required />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Teléfono</mat-label>
    <input matInput formControlName="phone" required />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Tipo de documento</mat-label>
    <input matInput formControlName="documentType" placeholder="DNI / NIE / PASAPORTE" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Número de documento</mat-label>
    <input matInput formControlName="documentNumber" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Fecha de nacimiento</mat-label>
    <input matInput type="date" formControlName="dateOfBirth" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Nacionalidad</mat-label>
    <input matInput formControlName="nationality" />
  </mat-form-field>

  <mat-form-field class="wide-field">
    <mat-label>Dirección</mat-label>
    <input matInput formControlName="address" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Situación laboral</mat-label>
    <input matInput formControlName="employmentStatus" placeholder="Empleado / Autónomo / ..." />
  </mat-form-field>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
    @if (loading()) {
      <mat-spinner diameter="20" />
    } @else {
      Guardar
    }
  </button>
</form>
