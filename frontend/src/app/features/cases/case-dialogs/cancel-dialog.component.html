<h2 mat-dialog-title>Cancelar caso</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="field-row">
    <mat-form-field>
      <mat-label>Motivo</mat-label>
      <mat-select formControlName="reason" required>
        @for (reason of reasons; track reason) {
          <mat-option [value]="reason">
            {{ reason | statusLabel: cancellationReasonLabels }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Comentario (opcional)</mat-label>
      <input matInput formControlName="comment" />
    </mat-form-field>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelDialog()">Volver</button>
    <button mat-flat-button color="warn" type="submit" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="20" />
      } @else {
        Cancelar caso
      }
    </button>
  </mat-dialog-actions>
</form>
