<h2 mat-dialog-title>Añadir cliente al caso</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="field-row">
    <mat-form-field>
      <mat-label>Cliente</mat-label>
      <mat-select formControlName="clientId" required>
        @for (client of clients(); track client.id) {
          <mat-option [value]="client.id">{{ client.firstName }} {{ client.lastName }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Tipo de participación</mat-label>
      <mat-select formControlName="participationType" required>
        @for (type of participationTypes; track type) {
          <mat-option [value]="type">{{ type }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-checkbox formControlName="isPrimary">Titular principal</mat-checkbox>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="20" />
      } @else {
        Añadir
      }
    </button>
  </mat-dialog-actions>
</form>
