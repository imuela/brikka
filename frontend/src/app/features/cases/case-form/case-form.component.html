<h1>{{ isEditMode ? 'Editar caso' : 'Nuevo caso' }}</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="field-row">
  <mat-form-field>
    <mat-label>Tipo de operación</mat-label>
    <mat-select formControlName="operationType" required>
      @for (type of operationTypes; track type) {
        <mat-option [value]="type">{{ type | statusLabel: operationTypeLabels }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Importe solicitado</mat-label>
    <input matInput type="number" formControlName="requestedAmount" />
  </mat-form-field>

  <mat-form-field class="wide-field">
    <mat-label>Descripción / notas del expediente</mat-label>
    <textarea matInput rows="3" formControlName="description"></textarea>
  </mat-form-field>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
    @if (loading()) {
      <mat-spinner diameter="20" />
    } @else {
      Guardar
    }
  </button>
</form>
