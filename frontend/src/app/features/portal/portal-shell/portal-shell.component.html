<mat-toolbar class="app-toolbar">
  <a routerLink="/portal" class="app-title">
    <app-logo variant="full" theme="light" [heightPx]="26" />
    <span class="portal-label">Portal Cliente</span>
  </a>
  <span class="spacer"></span>
  @if (portalSessionStore.client(); as client) {
    <span class="client-name">{{ client.firstName }} {{ client.lastName }}</span>
  }
  <a mat-button routerLink="/portal/profile">
    <mat-icon>account_circle</mat-icon>
    Mi perfil
  </a>
  <button mat-button (click)="logout()">
    <mat-icon>logout</mat-icon>
    Cerrar sesión
  </button>
</mat-toolbar>

<main class="portal-content">
  <router-outlet />
</main>
