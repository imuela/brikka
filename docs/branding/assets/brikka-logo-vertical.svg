      <stop offset="0%" stop-color="#1D5FD1"/>
      <stop offset="100%" stop-color="#123E8C"/>
    </linearGradient>
    <linearGradient id="brikka-b-top-v" x1="0%" y1="0%" x2="100%" y2="100%">
